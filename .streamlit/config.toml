[theme]
base = "light"
primaryColor = "#1769E0"
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D1D1F"
font = "sans serif"

[server]
headless = true
address = "127.0.0.1"
maxUploadSize = 100
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false
