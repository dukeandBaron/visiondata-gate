[package]
name = "visiondata-gate-desktop"
version = "0.1.0"
description = "Windows desktop host for the VisionData Gate industrial workspace"
authors = ["VisionData Gate contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "visiondata_gate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }
