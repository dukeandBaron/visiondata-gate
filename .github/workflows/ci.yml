name: Continuous verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --all-extras --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Check lint and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Compile Python sources
        run: uv run python -m compileall -q src app.py tools

      - name: Validate release evidence
        run: |
          uv run python tools/check_release_consistency.py
          uv run python tools/check_website_data.py
