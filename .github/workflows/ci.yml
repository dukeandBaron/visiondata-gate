name: Continuous verification

env:
  PYTHONUTF8: "1"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --all-extras --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Check lint and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Compile Python sources
        run: uv run python -m compileall -q src app.py tools

      # Keep native commands in separate steps.  On PowerShell a failed native
      # command in a multiline block does not necessarily terminate the step,
      # so a later success could otherwise turn a release validation red into
      # a misleading green check.
      - name: Validate submission evidence
        run: uv run python tools/check_release_consistency.py

      - name: Validate reviewer website projection
        run: uv run python tools/check_website_data.py

      - name: Validate detached release assets
        run: uv run python tools/check_release_assets.py
