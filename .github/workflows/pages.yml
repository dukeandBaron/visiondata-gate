name: Public synthetic workbench

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Privacy gate and static workbench build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete public history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify current public tree and history
        run: python tools/check_public_repository.py --history

      - name: Verify SHA-bound public replay manifest
        run: python tools/check_public_pages.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck public workbench
        working-directory: web
        run: npm run typecheck

      - name: Build public synthetic replay
        working-directory: web
        env:
          VITE_VISIONDATA_PUBLIC_REPLAY: "true"
          VISIONDATA_WEB_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Verify built Pages artifact
        run: python tools/check_public_pages.py --dist web/dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: Deploy privacy-safe workbench
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
