name: Feature request
description: 提议边界清晰、可验证的新能力
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先描述操作者任务和当前阻力，不要只写解决方案名称。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果与验收方式
      description: 说明输入、可观察输出、失败状态和最小验收条件。
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: 权限边界
      options:
        - 只读证据或显示
        - 私有派生写入，需要具名人工动作
        - 外部系统集成，需要独立安全设计
        - 尚不确定
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: 复用价值
      description: 如果适用，说明 Schema、Rule Pack、Skill 或 Adapter 的通用性。
  - type: checkboxes
    id: safety
    attributes:
      label: 公开安全确认
      options:
        - label: 此提议不包含客户数据、个人信息、密钥或私域运行回执。
          required: true

